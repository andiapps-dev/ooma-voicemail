name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - run: go vet ./...

      - run: go build ./...

      - run: go test ./...

  docker-build:
    # Separate from the `test` job so a Dockerfile/base-image problem is
    # never mistaken for a Go one, or vice versa. This exists because
    # neither Dockerfile base-image bump (golang, alpine) that Dependabot
    # opens actually touches Go source — without this, `test` passing
    # gave those PRs a green check despite the Dockerfile itself never
    # having been built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
